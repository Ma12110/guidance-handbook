<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc">
  <title id="title">三维制导坐标系与角度总图</title>
  <desc id="desc">纵向四层大图，依次说明三维弹目几何、水平面方位与航向、垂直面视线仰角与航迹姿态角、速度法平面倾侧角和终端方向误差。</desc>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#28678f"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27836d"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c27d35"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b65353"/></marker>
    <style>
      .t{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#20384b}.title{font-size:31px;font-weight:700}.sub{font-size:20px;fill:#5c7284}.head{font-size:26px;font-weight:700}.label{font-size:22px}.symbol{font-family:"Cambria Math","Times New Roman",serif;font-size:25px;font-weight:700}.hint{font-size:19px;fill:#566f82}.panel{fill:#f9fbfd;stroke:#c8d7e2;stroke-width:2}.axis{stroke:#91a8b8;stroke-width:3}.dash{stroke:#9fb3c1;stroke-width:2;stroke-dasharray:8 7}.los{stroke:#28678f;stroke-width:6}.velM{stroke:#27836d;stroke-width:6}.velT{stroke:#c27d35;stroke-width:6}.body{stroke:#b65353;stroke-width:6}.desired{stroke:#7955a6;stroke-width:6}.arc{fill:none;stroke-width:4}.badge{fill:#e8f1f7;stroke:#b9cedc}.white{fill:white;stroke:#d0dde6;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="1510" fill="#eef3f7"/>
  <text class="t title" x="42" y="49">三维制导坐标系与角度总图</text>
  <text class="t sub" x="42" y="82">右手系 · 导航系采用 ENU · 相对位置 r = rₜ − rₘ · 角度内部用 rad，页面显示可换成 °</text>

  <g transform="translate(30 105)">
    <rect class="panel" width="1140" height="320" rx="18"/>
    <circle class="badge" cx="42" cy="42" r="24"/><text class="t head" x="32" y="51">A</text>
    <text class="t head" x="80" y="51">三维弹目几何：制导律首先使用矢量</text>
    <g transform="translate(105 260)">
      <line class="axis" x1="0" y1="0" x2="225" y2="0" marker-end="url(#ar)"/><text class="t label" x="238" y="7">东 E / xₙ</text>
      <line class="axis" x1="0" y1="0" x2="-72" y2="-55" marker-end="url(#ag)"/><text class="t label" x="-98" y="-66">北 N / yₙ</text>
      <line class="axis" x1="0" y1="0" x2="0" y2="-150" marker-end="url(#ab)"/><text class="t label" x="14" y="-148">天 U / zₙ</text>
      <circle cx="95" cy="-28" r="11" fill="#28678f"/><text class="t label" x="58" y="5">导弹 M</text>
      <circle cx="640" cy="-195" r="11" fill="#c27d35"/><text class="t label" x="657" y="-188">目标 T</text>
      <line class="los" x1="95" y1="-28" x2="632" y2="-192" marker-end="url(#ab)"/><text class="t symbol" x="360" y="-132">r，LOS</text>
      <line class="velM" x1="95" y1="-28" x2="280" y2="-77" marker-end="url(#ag)"/><text class="t symbol" x="208" y="-88">vₘ</text>
      <line class="velT" x1="640" y1="-195" x2="510" y2="-255" marker-end="url(#ao)"/><text class="t symbol" x="520" y="-258">vₜ</text>
      <line class="dash" x1="95" y1="-28" x2="95" y2="-190"/><text class="t hint" x="105" y="-167">LOS 随时间在三维空间转动</text>
    </g>
    <g transform="translate(805 92)">
      <rect class="white" width="300" height="178" rx="12"/>
      <text class="t label" x="20" y="38">三维 PN 的直接输入</text>
      <text class="t symbol" x="20" y="80">r̂　V<tspan baseline-shift="sub" font-size="17">c</tspan>　ω<tspan baseline-shift="sub" font-size="17">LOS</tspan></text>
      <text class="t hint" x="20" y="119">方位角、仰角主要用于显示</text>
      <text class="t hint" x="20" y="150">不要先拆成两个二维 PN</text>
    </g>
  </g>

  <g transform="translate(30 445)">
    <rect class="panel" width="1140" height="320" rx="18"/>
    <circle class="badge" cx="42" cy="42" r="24"/><text class="t head" x="32" y="51">B</text>
    <text class="t head" x="80" y="51">水平投影：LOS 方位角、航向角与前置角</text>
    <g transform="translate(190 270)">
      <line class="axis" x1="0" y1="0" x2="0" y2="-190" marker-end="url(#ag)"/><text class="t label" x="14" y="-180">北 N</text>
      <line class="axis" x1="0" y1="0" x2="410" y2="0" marker-end="url(#ar)"/><text class="t label" x="424" y="7">东 E</text>
      <circle cx="0" cy="0" r="10" fill="#28678f"/><text class="t label" x="-75" y="30">导弹 M</text>
      <line class="los" x1="0" y1="0" x2="360" y2="-135" marker-end="url(#ab)"/><text class="t label" x="285" y="-151">LOS 水平投影</text>
      <line class="velM" x1="0" y1="0" x2="285" y2="-185" marker-end="url(#ag)"/><text class="t label" x="220" y="-201">vₘ 水平投影</text>
      <path class="arc" d="M0 -75 A75 75 0 0 1 70 -26" stroke="#28678f" marker-end="url(#ab)"/><text class="t symbol" x="18" y="-82">λ<tspan baseline-shift="sub" font-size="17">az</tspan></text>
      <path class="arc" d="M0 -120 A120 120 0 0 1 100 -65" stroke="#27836d" marker-end="url(#ag)"/><text class="t symbol" x="63" y="-129">χₘ</text>
      <path class="arc" d="M190 -123 A228 228 0 0 1 210 -79" stroke="#7955a6"/><text class="t symbol" x="220" y="-109">ηₘ</text>
    </g>
    <g transform="translate(680 94)">
      <text class="t symbol" x="0" y="35">λ<tspan baseline-shift="sub" font-size="17">az</tspan></text><text class="t label" x="75" y="35">LOS 方位角：北起向东为正</text>
      <text class="t symbol" x="0" y="85">χₘ</text><text class="t label" x="75" y="85">导弹航向角：速度水平投影方向</text>
      <text class="t symbol" x="0" y="135">ηₘ</text><text class="t label" x="75" y="135">导弹前置角：v̂ₘ 与 r̂ 的三维夹角</text>
      <rect x="0" y="165" width="410" height="58" rx="10" fill="#fff4df" stroke="#e5c990"/>
      <text class="t hint" x="16" y="201">ηₘ 通常不等于 λ<tspan baseline-shift="sub">az</tspan> − χₘ：三维夹角不能只看俯视图</text>
    </g>
  </g>

  <g transform="translate(30 785)">
    <rect class="panel" width="1140" height="330" rx="18"/>
    <circle class="badge" cx="42" cy="42" r="24"/><text class="t head" x="32" y="51">C</text>
    <text class="t head" x="80" y="51">垂直投影：LOS 仰角、航迹倾角、俯仰角与攻角</text>
    <g transform="translate(105 270)">
      <line class="axis" x1="0" y1="0" x2="535" y2="0" marker-end="url(#ar)"/><text class="t label" x="548" y="7">局部水平面</text>
      <line class="axis" x1="0" y1="0" x2="0" y2="-190" marker-end="url(#ab)"/><text class="t label" x="14" y="-180">天 U</text>
      <line class="los" x1="0" y1="0" x2="470" y2="-165" marker-end="url(#ab)"/><text class="t label" x="430" y="-181">LOS</text>
      <line class="velM" x1="0" y1="0" x2="430" y2="-85" marker-end="url(#ag)"/><text class="t symbol" x="395" y="-96">vₘ</text>
      <line class="body" x1="0" y1="0" x2="405" y2="-126" marker-end="url(#ar)"/><text class="t label" x="338" y="-141">x<tspan baseline-shift="sub">b</tspan> / 视轴</text>
      <path class="arc" d="M75 0 A75 75 0 0 0 71 -25" stroke="#28678f"/><text class="t symbol" x="76" y="-8">λ<tspan baseline-shift="sub" font-size="17">el</tspan></text>
      <path class="arc" d="M135 0 A135 135 0 0 0 133 -27" stroke="#27836d"/><text class="t symbol" x="140" y="-29">γₘ</text>
      <path class="arc" d="M200 0 A200 200 0 0 0 191 -62" stroke="#b65353"/><text class="t symbol" x="200" y="-61">θ</text>
      <path class="arc" d="M282 -88 A295 295 0 0 1 288 -57" stroke="#7955a6"/><text class="t symbol" x="300" y="-69">α</text>
      <path class="arc" d="M350 -109 A365 365 0 0 0 344 -121" stroke="#c27d35"/><text class="t symbol" x="355" y="-120">θ<tspan baseline-shift="sub" font-size="17">off</tspan></text>
    </g>
    <g transform="translate(755 87)">
      <text class="t symbol" x="0" y="35">λ<tspan baseline-shift="sub" font-size="17">el</tspan></text><text class="t label" x="85" y="35">LOS 相对水平面的仰角</text>
      <text class="t symbol" x="0" y="80">γₘ</text><text class="t label" x="85" y="80">速度相对水平面的航迹倾角</text>
      <text class="t symbol" x="0" y="125">θ</text><text class="t label" x="85" y="125">机体俯仰角</text>
      <text class="t symbol" x="0" y="170">α</text><text class="t label" x="85" y="170">攻角：机体纵轴与速度方向之差</text>
      <text class="t symbol" x="0" y="215">θ<tspan baseline-shift="sub" font-size="17">off</tspan></text><text class="t label" x="85" y="215">视轴与 LOS 的三维离轴角</text>
    </g>
  </g>

  <g transform="translate(30 1135)">
    <rect class="panel" width="1140" height="340" rx="18"/>
    <circle class="badge" cx="42" cy="42" r="24"/><text class="t head" x="32" y="51">D</text>
    <text class="t head" x="80" y="51">局部控制角与终端约束：它们不是同一个“方向角”</text>
    <g transform="translate(235 202)">
      <circle class="white" cx="0" cy="0" r="112"/>
      <line class="axis" x1="0" y1="0" x2="0" y2="-145" marker-end="url(#ab)"/><text class="t label" x="12" y="-133">零倾侧升力方向</text>
      <line class="axis" x1="0" y1="0" x2="145" y2="0" marker-end="url(#ao)"/><text class="t label" x="157" y="7">+yᵥ</text>
      <line class="velM" x1="0" y1="0" x2="103" y2="-103" marker-end="url(#ag)"/><text class="t symbol" x="111" y="-98">a<tspan baseline-shift="sub" font-size="17">⊥</tspan></text>
      <path class="arc" d="M0 -74 A74 74 0 0 1 53 -53" stroke="#27836d" marker-end="url(#ag)"/><text class="t symbol" x="28" y="-80">φᵥ</text>
      <text class="t hint" x="-125" y="155">沿 +xᵥ 观察速度法平面</text>
    </g>
    <g transform="translate(615 267)">
      <circle cx="0" cy="0" r="8" fill="#28678f"/>
      <line class="velM" x1="0" y1="0" x2="310" y2="-125" marker-end="url(#ag)"/><text class="t label" x="242" y="-137">终端速度 vₘ(t<tspan baseline-shift="sub">f</tspan>)</text>
      <line class="desired" x1="0" y1="0" x2="270" y2="-200" marker-end="url(#ar)"/><text class="t label" x="184" y="-214">期望方向 d̂<tspan baseline-shift="sub">f</tspan>(χ<tspan baseline-shift="sub">f</tspan>, γ<tspan baseline-shift="sub">f</tspan>)</text>
      <path class="arc" d="M185 -137 A230 230 0 0 0 206 -83" stroke="#7955a6"/><text class="t symbol" x="220" y="-111">ε<tspan baseline-shift="sub" font-size="17">f</tspan></text>
      <text class="t label" x="0" y="42">终端方向误差 ε<tspan baseline-shift="sub">f</tspan> 与位置脱靶量是两个独立指标</text>
    </g>
    <text class="t label" x="420" y="125">β：速度相对机体对称面的侧滑角</text>
    <text class="t label" x="420" y="165">ηₜ：目标速度 v̂ₜ 与反 LOS（−r̂）的迎向夹角</text>
  </g>
</svg>
